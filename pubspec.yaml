name: spicecompanion
description: A fork of spicecompanion project
publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=2.10.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.0
  pool: ^1.4.0
  intl: ^0.16.1
  shared_preferences:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/shared_preferences/shared_preferences
      ref: shared_preferences-v2.2.2-ohos-1.0.1
  #flutter_nfc_reader:
  #  path: external/flutter-nfc-reader
  hex: ^0.1.2
  #share: ^0.6.0+1
  share_plus:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_plus_plugins.git
      path: packages/share_plus/share_plus
      ref: sensors_plus-7.2.0-ohos.1.0.0-beta.1
  path: ^1.8.0
  #vibration: ^1.7.3
  mutex: ^1.1.0
  desktop_window: ^0.3.0

dependency_overrides:
  path_provider:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/path_provider/path_provider
      ref: provider-v2.1.1-ohos-1.0.1

dev_dependencies:
  #flutter_test:
  #  sdk: flutter
  flutter_launcher_icons: ^0.13.1

# do `flutter packages pub run flutter_launcher_icons:main` to regenerate icons
flutter_icons:
  android: "launcher_icon" 
  ios: true
  image_path: "assets/spice.png"
  min_sdk_android: 19
  web:
    generate: true
    image_path: "assets/spice.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  windows:
    generate: true
    image_path: "assets/spice.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/spice.png"

flutter:
  # bundle material icons
  uses-material-design: true
  assets:
    - assets/
    - assets/patches/
